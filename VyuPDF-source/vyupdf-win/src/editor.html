<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>VyuPDF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#404040;color:#333;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Toolbar - Adobe style */
#tb{background:#323232;height:40px;display:flex;align-items:center;gap:1px;padding:0 8px;flex-shrink:0;border-bottom:1px solid #1a1a1a}
#appname{font-size:12px;font-weight:600;color:#e0e0e0;margin-right:10px;padding-right:10px;border-right:1px solid #555;white-space:nowrap}
.tb-grp{display:flex;align-items:center;gap:1px;padding:0 4px;border-right:1px solid #555;margin-right:2px}
.tb-grp:last-of-type{border-right:none}
.tbtn{background:none;border:none;color:#ccc;cursor:pointer;padding:5px 8px;border-radius:3px;font-size:11px;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:all .1s;height:30px}
.tbtn:hover:not(:disabled){background:#4a4a4a;color:#fff}
.tbtn.on{background:#0064b4;color:#fff}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.tbtn svg{width:14px;height:14px;flex-shrink:0}
#fi{margin-left:auto;font-size:10px;color:#999;padding-left:8px;white-space:nowrap}

/* Layout */
#main{display:flex;flex:1;overflow:hidden}

/* Left sidebar - thumbnails */
#sb{width:136px;background:#2b2b2b;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;flex-shrink:0}
#sbh{padding:7px 10px;font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between}
#pl{flex:1;overflow-y:auto;padding:6px;background:#2b2b2b;scrollbar-width:thin;scrollbar-color:#555 transparent}
.th{border:2px solid transparent;border-radius:3px;margin-bottom:6px;cursor:pointer;overflow:hidden;background:#1a1a1a;position:relative;transition:border-color .1s}
.th:hover{border-color:#888}
.th.sel{border-color:#0064b4}
.th canvas{width:100%;height:auto;display:block}
.th .pn{position:absolute;bottom:2px;right:4px;font-size:8px;color:#ccc;background:rgba(0,0,0,.7);padding:1px 3px;border-radius:2px}
.th .pd{position:absolute;top:2px;right:2px;background:rgba(180,30,30,.9);color:#fff;border:none;border-radius:2px;width:14px;height:14px;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center}
.th:hover .pd{display:flex}

/* Canvas - WHITE background like Adobe */
#cw{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px;background:#606060;position:relative;scrollbar-width:thin;scrollbar-color:#888 transparent}
#pc{position:relative;box-shadow:0 2px 12px rgba(0,0,0,.5);display:inline-block;background:#fff}
#cv{display:block;background:#fff}
#ov{position:absolute;top:0;left:0;pointer-events:none;overflow:hidden}

/* Annotations */
.an{position:absolute}
.an.selected .ann-handle{display:flex}
.ann-wrap{position:relative}
.ann-handle{position:absolute;top:-24px;right:0;display:none;gap:3px;background:#333;border-radius:3px;padding:2px 4px;z-index:10}
.ann-handle button{background:none;border:none;color:#ccc;cursor:pointer;font-size:10px;padding:1px 4px;border-radius:2px}
.ann-handle button:hover{background:#555;color:#fff}
.at{background:rgba(255,255,150,.92);border:1px solid #cca800;padding:3px 7px;font-size:14px;color:#111;border-radius:2px;min-width:30px;min-height:22px;outline:none;word-break:break-word;white-space:pre-wrap;cursor:text;-webkit-user-select:text;user-select:text;line-height:1.4}
.ai-wrap{position:relative}
.ai-wrap img{display:block;border:1px solid #0064b4}
.rz{position:absolute;width:8px;height:8px;background:#0064b4;border-radius:50%;cursor:se-resize}
.rz-se{bottom:-4px;right:-4px}
.rz-sw{bottom:-4px;left:-4px;cursor:sw-resize}
.rz-ne{top:-4px;right:-4px;cursor:ne-resize}
.rz-nw{top:-4px;left:-4px;cursor:nw-resize}
.drag-cursor{cursor:move}

/* Empty state */
#em{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#aaa}
#em svg{opacity:.3;width:64px;height:64px}
#em h2{font-size:16px;color:#bbb}
#em p{font-size:12px;text-align:center;max-width:240px;line-height:1.6;color:#999}
.ob{background:#0064b4;color:#fff;border:none;padding:8px 20px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;margin-top:4px}
.ob:hover{background:#0078d4}

/* Right panel - properties */
#rp{width:200px;background:#f0f0f0;border-left:1px solid #ccc;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.ps{padding:10px 12px;border-bottom:1px solid #ddd}
.pt{font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.pl{font-size:10px;color:#666;display:block;margin-bottom:3px}
.pi{width:100%;background:#fff;border:1px solid #ccc;color:#333;padding:5px 8px;border-radius:3px;font-size:11px;margin-bottom:6px}
.pi:focus{outline:none;border-color:#0064b4}
input[type=range]{width:100%;accent-color:#0064b4;margin-bottom:2px}
.pb{width:100%;background:#fff;border:1px solid #ccc;color:#555;cursor:pointer;padding:6px 10px;border-radius:3px;font-size:11px;display:flex;align-items:center;gap:6px;margin-bottom:4px;transition:all .1s;text-align:left}
.pb:hover{background:#e8e8e8;border-color:#999}
.pb svg{width:12px;height:12px;flex-shrink:0;color:#0064b4}
.pb.del:hover{background:#fde8e8;border-color:#dc3545;color:#dc3545}
#oc{background:#fff;border:1px solid #ddd;border-radius:3px;padding:6px;font-size:10px;color:#555;min-height:70px;max-height:160px;overflow-y:auto;white-space:pre-wrap;line-height:1.5}

/* Status */
#st{height:22px;background:#323232;border-top:1px solid #1a1a1a;display:flex;align-items:center;padding:0 10px;gap:14px;font-size:10px;color:#aaa;flex-shrink:0}

/* Zoom */
#zm{position:fixed;bottom:28px;right:208px;display:flex;align-items:center;gap:2px;background:#323232;border:1px solid #555;border-radius:4px;padding:3px}
.zb{background:none;border:none;color:#aaa;cursor:pointer;width:24px;height:24px;border-radius:3px;font-size:13px;display:flex;align-items:center;justify-content:center}
.zb:hover{background:#4a4a4a;color:#fff}
#zl{font-size:10px;color:#aaa;padding:0 5px;min-width:38px;text-align:center}

/* Progress */
#pgb{position:fixed;top:40px;left:0;right:0;height:2px;background:#0064b4;display:none;z-index:999}
</style>
</head>
<body>
<div id="pgb"></div>

<!-- Toolbar -->
<div id="tb">
  <span id="appname">VyuPDF</span>

  <div class="tb-grp">
    <button class="tbtn" onclick="openFile()" title="Open (Ctrl+O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Open
    </button>
    <button class="tbtn" id="bs" onclick="doSave()" disabled title="Save (Ctrl+S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save
    </button>
    <button class="tbtn" id="bsa" onclick="doSaveAs()" disabled title="Save As">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save As
    </button>
  </div>

  <div class="tb-grp">
    <button class="tbtn" id="bt" onclick="setTool('text')" disabled title="Add text (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>Add Text
    </button>
    <button class="tbtn" id="bi" onclick="addImg()" disabled title="Add image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Add Image
    </button>
  </div>

  <div class="tb-grp">
    <button class="tbtn" id="bap" onclick="addPages()" disabled title="Add pages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Pages
    </button>
    <button class="tbtn" id="bo" onclick="runOCR()" disabled title="Extract text (OCR)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>OCR
    </button>
    <button class="tbtn" id="bc" onclick="doCompress()" disabled title="Compress PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>Compress
    </button>
  </div>

  <div id="fi">No file open</div>
</div>

<div id="main">
  <!-- Sidebar thumbnails -->
  <div id="sb">
    <div id="sbh"><span>Pages</span><span id="pgc" style="color:#6af">0</span></div>
    <div id="pl"></div>
  </div>

  <!-- Canvas - white PDF area -->
  <div id="cw" ondragover="event.preventDefault()" ondrop="onDrop(event)">
    <div id="em">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2h28l14 14v44a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><polyline points="42 2 42 16 56 16"/><line x1="20" y1="32" x2="44" y2="32"/><line x1="20" y1="40" x2="44" y2="40"/><line x1="20" y1="24" x2="32" y2="24"/></svg>
      <h2>VyuPDF</h2>
      <p>Open a PDF to start editing<br/>or drag and drop here</p>
      <button class="ob" onclick="openFile()">Open PDF</button>
    </div>
    <div id="pc" style="display:none">
      <canvas id="cv"></canvas>
      <div id="ov"></div>
    </div>
  </div>

  <!-- Right panel -->
  <div id="rp">
    <div class="ps">
      <div class="pt">Text</div>
      <label class="pl">Font Size — <span id="fsv">14</span>pt</label>
      <input type="range" id="fs" min="6" max="72" value="14" oninput="document.getElementById('fsv').textContent=this.value;updateSel()"/>
      <label class="pl" style="margin-top:4px">Color</label>
      <input type="color" id="tc" value="#000000" class="pi" style="height:28px;padding:1px 3px;cursor:pointer" oninput="updateSel()"/>
    </div>
    <div class="ps">
      <div class="pt">Page</div>
      <button class="pb" onclick="movePg(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>Move Up</button>
      <button class="pb" onclick="movePg(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>Move Down</button>
      <button class="pb del" onclick="delPage()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>Delete Page</button>
    </div>
    <div class="ps" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div class="pt">OCR Text</div>
      <div id="oc" style="flex:1">Run OCR to extract text.</div>
      <button class="pb" onclick="navigator.clipboard.writeText(document.getElementById('oc').textContent);msg('Copied')" style="margin-top:6px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Text
      </button>
    </div>
    <div style="padding:8px 12px;border-top:1px solid #ddd;text-align:center">
      <div style="font-size:9px;color:#aaa;line-height:1.6">VyuPDF v1.0 · Apache 2.0<br/>Vyuhaa Med Data Pvt Ltd</div>
    </div>
  </div>
</div>

<!-- Zoom -->
<div id="zm">
  <button class="zb" onclick="doZoom(-.25)">−</button>
  <span id="zl">100%</span>
  <button class="zb" onclick="doZoom(.25)">+</button>
  <button class="zb" onclick="setZoom(1)" title="Fit">⊡</button>
</div>

<!-- Status -->
<div id="st">
  <span id="sf">No file open</span>
  <span id="spg"></span>
  <span id="stool" style="color:#6af"></span>
  <span style="margin-left:auto" id="sm"></span>
</div>

<script src="../node_modules/pdf-lib/dist/pdf-lib.min.js"></script>
<script>
// Load PDF.js
function ldScript(src){return new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s);})}

const {PDFDocument,rgb,StandardFonts}=PDFLib;
let pdfDoc=null,pdfJSDoc=null,curPage=0,zoom=1;
let tool=null,anns={},dirty=false,pgCount=0,fileName='document.pdf';
let selEl=null; // selected annotation element

async function init(){
  try{
    await ldScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  }catch(e){msg('PDF.js load failed');}

  if(window.api){
    window.api.onCmd(a=>{
      const m={'open':openFile,'save':doSave,'save-as':doSaveAs,
        'tool-text':()=>setTool('text'),'add-image':addImg,'add-pages':addPages,
        'page-up':()=>movePg(-1),'page-down':()=>movePg(1),'page-delete':delPage,
        'ocr':runOCR,'compress':doCompress,
        'zoom-in':()=>doZoom(.25),'zoom-out':()=>doZoom(-.25),'zoom-reset':()=>setZoom(1),
      };
      if(m[a])m[a]();
    });
  }

  document.addEventListener('keydown',e=>{
    const m=e.ctrlKey||e.metaKey;
    if(m&&e.key==='o'){e.preventDefault();openFile();}
    if(m&&!e.shiftKey&&e.key==='s'){e.preventDefault();doSave();}
    if(m&&e.shiftKey&&e.key==='S'){e.preventDefault();doSaveAs();}
    if(e.key==='t'&&!e.ctrlKey&&!e.metaKey&&document.activeElement.tagName!=='INPUT'){setTool('text');}
    if(e.key==='Escape'){setTool(null);deselect();}
    if((e.key==='Delete'||e.key==='Backspace')&&selEl&&document.activeElement.tagName!=='DIV'){
      e.preventDefault(); removeAnn(selEl);
    }
    if(m&&(e.key==='='||e.key==='+')){e.preventDefault();doZoom(.25);}
    if(m&&e.key==='-'){e.preventDefault();doZoom(-.25);}
    if(m&&e.key==='0'){e.preventDefault();setZoom(1);}
  });

  // Click outside deselects
  document.getElementById('cw').addEventListener('mousedown',e=>{
    if(e.target===document.getElementById('cw')||e.target===document.getElementById('pc')||e.target===document.getElementById('cv'))
      deselect();
  });
}

// ── Progress & msg ─────────────────────────────────────────────
function prog(p){const e=document.getElementById('pgb');if(p>=100){setTimeout(()=>e.style.display='none',500);e.style.width='100%';return;}e.style.display='block';e.style.width=p+'%';}
function msg(m){document.getElementById('sm').textContent=m;}
function enableAll(on){['bs','bsa','bt','bi','bap','bo','bc'].forEach(id=>document.getElementById(id).disabled=!on);}

// ── Open ───────────────────────────────────────────────────────
async function openFile(){
  if(!window.api)return;
  const r=await window.api.openDialog({title:'Open PDF',filters:[{name:'PDF',extensions:['pdf']}],properties:['openFile']});
  if(r.canceled||!r.filePaths[0])return;
  fileName=r.filePaths[0].split(/[\\/]/).pop();
  const buf=await window.api.readFile(r.filePaths[0]);
  await load(buf);
}
async function onDrop(e){
  e.preventDefault();
  const f=[...e.dataTransfer.files].find(f=>f.name.endsWith('.pdf'));
  if(f){fileName=f.name;await load(await f.arrayBuffer());}
}
async function load(buf){
  try{
    msg('Loading…');prog(15);
    const arr=buf instanceof ArrayBuffer?buf:buf.buffer.slice(buf.byteOffset,buf.byteOffset+buf.byteLength);
    pdfDoc=await PDFDocument.load(arr,{ignoreEncryption:true});prog(45);
    pdfJSDoc=await pdfjsLib.getDocument({data:new Uint8Array(arr)}).promise;prog(80);
    pgCount=pdfDoc.getPageCount();anns={};curPage=0;dirty=false;
    document.getElementById('em').style.display='none';
    document.getElementById('pc').style.display='inline-block';
    document.getElementById('fi').textContent=fileName;
    document.getElementById('sf').textContent=fileName;
    if(window.api)window.api.setTitle('VyuPDF — '+fileName);
    enableAll(true);
    await renderThumbs();await renderPage(0);prog(100);msg('Ready');
  }catch(e){msg('Error: '+e.message);prog(100);}
}

// ── Render ─────────────────────────────────────────────────────
async function renderPage(idx){
  curPage=idx;
  document.getElementById('spg').textContent=`Page ${idx+1} / ${pgCount}`;
  const page=await pdfJSDoc.getPage(idx+1);
  const vp=page.getViewport({scale:zoom*1.5});
  const c=document.getElementById('cv');
  c.width=vp.width;c.height=vp.height;
  c.style.background='#fff';
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const ov=document.getElementById('ov');
  ov.style.width=vp.width+'px';ov.style.height=vp.height+'px';
  ov.innerHTML='';selEl=null;
  if(anns[idx])anns[idx].forEach(a=>ov.appendChild(a.el));
  document.querySelectorAll('.th').forEach((t,i)=>t.classList.toggle('sel',i===idx));
}

async function renderThumbs(){
  const list=document.getElementById('pl');
  list.innerHTML='';
  document.getElementById('pgc').textContent=pgCount;
  for(let i=0;i<pgCount;i++){
    const pg=await pdfJSDoc.getPage(i+1);
    const vp=pg.getViewport({scale:.22});
    const c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const div=document.createElement('div');div.className='th';div.dataset.i=i;
    div.appendChild(c);
    const pn=document.createElement('span');pn.className='pn';pn.textContent=i+1;div.appendChild(pn);
    const pd=document.createElement('button');pd.className='pd';pd.textContent='×';
    pd.onclick=ev=>{ev.stopPropagation();delPageAt(i);};
    div.appendChild(pd);
    div.onclick=()=>{deselect();renderPage(i);};
    list.appendChild(div);
  }
}

// ── Selection ──────────────────────────────────────────────────
function select(el){
  deselect();
  selEl=el;
  el.classList.add('selected');
}
function deselect(){
  if(selEl){selEl.classList.remove('selected');selEl=null;}
}
function removeAnn(el){
  if(!el)return;
  if(anns[curPage])anns[curPage]=anns[curPage].filter(a=>a.el!==el);
  el.remove();selEl=null;dirty=true;
}

// ── Tool ───────────────────────────────────────────────────────
function setTool(t){
  tool=tool===t?null:t;
  document.getElementById('bt').classList.toggle('on',tool==='text');
  document.getElementById('stool').textContent=tool?`Tool: ${tool} — click on page`:'';
  const ov=document.getElementById('ov');
  ov.style.pointerEvents=tool?'all':'none';
  ov.style.cursor=tool==='text'?'text':'default';
  ov.onclick=tool==='text'?placeText:null;
}

// ── Text annotation ────────────────────────────────────────────
function placeText(e){
  const ov=document.getElementById('ov');
  const r=ov.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;

  const wrap=document.createElement('div');
  wrap.className='an';
  wrap.style.cssText=`position:absolute;left:${x}px;top:${y}px`;

  const el=document.createElement('div');
  el.className='at';
  el.contentEditable='true';
  el.textContent='Type here';
  el.style.fontSize=document.getElementById('fs').value+'px';
  el.style.color=document.getElementById('tc').value;

  wrap.appendChild(el);

  // Delete button on hover
  const del=document.createElement('button');
  del.textContent='✕ Delete';del.title='Delete (Del key)';
  del.style.cssText='position:absolute;top:-22px;right:0;background:#c00;color:#fff;border:none;border-radius:2px;padding:1px 6px;font-size:9px;cursor:pointer;display:none;white-space:nowrap;z-index:10';
  wrap.appendChild(del);
  wrap.addEventListener('mouseenter',()=>del.style.display='block');
  wrap.addEventListener('mouseleave',()=>del.style.display='none');
  del.onclick=()=>removeAnn(wrap);

  makeDrag(wrap, el);
  ov.appendChild(wrap);
  el.focus();document.execCommand('selectAll',false,null);

  if(!anns[curPage])anns[curPage]=[];
  anns[curPage].push({el:wrap,type:'text',textEl:el});
  dirty=true;

  wrap.addEventListener('mousedown',ev=>{if(ev.target!==el){select(wrap);}});
}

function updateSel(){
  if(!selEl)return;
  const el=selEl.querySelector('.at');
  if(el){
    el.style.fontSize=document.getElementById('fs').value+'px';
    el.style.color=document.getElementById('tc').value;
  }
}

// ── Image annotation ───────────────────────────────────────────
async function addImg(){
  if(!window.api)return;
  const r=await window.api.openDialog({title:'Add Image',filters:[{name:'Images',extensions:['jpg','jpeg','png','webp','bmp','gif']}],properties:['openFile']});
  if(r.canceled||!r.filePaths[0])return;
  const buf=await window.api.readFile(r.filePaths[0]);
  const ext=r.filePaths[0].split('.').pop().toLowerCase();
  const mime=ext==='png'?'image/png':'image/jpeg';
  const blob=new Blob([buf],{type:mime});
  const url=URL.createObjectURL(blob);

  const ov=document.getElementById('ov');
  const wrap=document.createElement('div');
  wrap.className='an';
  wrap.style.cssText='position:absolute;left:50px;top:50px';

  const imgEl=document.createElement('img');
  imgEl.src=url;imgEl.draggable=false;
  imgEl.style.cssText='width:220px;height:auto;display:block;border:2px solid #0064b4;cursor:move';

  // Resize handle
  const rz=document.createElement('div');
  rz.className='rz rz-se';

  // Delete button
  const del=document.createElement('button');
  del.textContent='✕ Delete';
  del.style.cssText='position:absolute;top:-22px;right:0;background:#c00;color:#fff;border:none;border-radius:2px;padding:1px 6px;font-size:9px;cursor:pointer;display:none;white-space:nowrap;z-index:10';
  wrap.appendChild(del);
  wrap.addEventListener('mouseenter',()=>del.style.display='block');
  wrap.addEventListener('mouseleave',()=>del.style.display='none');
  del.onclick=()=>removeAnn(wrap);

  wrap.appendChild(imgEl);wrap.appendChild(rz);

  makeDrag(wrap, imgEl);
  makeResize(imgEl, rz);

  ov.appendChild(wrap);
  select(wrap);

  if(!anns[curPage])anns[curPage]=[];
  anns[curPage].push({el:wrap,type:'image',buf,mime,imgEl});
  dirty=true;
}

// ── Add pages ──────────────────────────────────────────────────
async function addPages(){
  if(!window.api)return;
  const r=await window.api.openDialog({title:'Add PDF or Images',filters:[{name:'PDF & Images',extensions:['pdf','jpg','jpeg','png','webp','bmp']}],properties:['openFile','multiSelections']});
  if(r.canceled||!r.filePaths.length)return;
  msg('Adding pages…');prog(10);
  for(let i=0;i<r.filePaths.length;i++){
    const fp=r.filePaths[i];const buf=await window.api.readFile(fp);
    const ext=fp.split('.').pop().toLowerCase();
    if(ext==='pdf'){
      const src=await PDFDocument.load(buf);
      const pages=await pdfDoc.copyPages(src,src.getPageIndices());
      pages.forEach(p=>pdfDoc.addPage(p));
    }else{
      const ib=new Uint8Array(buf instanceof ArrayBuffer?buf:buf.buffer);
      let im;try{im=await pdfDoc.embedPng(ib);}catch{im=await pdfDoc.embedJpg(ib);}
      const pg=pdfDoc.addPage([im.width,im.height]);
      pg.drawImage(im,{x:0,y:0,width:im.width,height:im.height});
    }
    prog(10+Math.round((i+1)/r.filePaths.length*80));
  }
  const bytes=await pdfDoc.save();await reload(bytes);dirty=true;prog(100);msg('Pages added');
}

async function reload(bytes){
  pdfDoc=await PDFDocument.load(bytes);
  pdfJSDoc=await pdfjsLib.getDocument({data:bytes}).promise;
  pgCount=pdfDoc.getPageCount();
  await renderThumbs();await renderPage(Math.min(curPage,pgCount-1));
}

// ── OCR ────────────────────────────────────────────────────────
async function runOCR(){
  if(!pdfJSDoc)return;
  msg('Running OCR…');prog(10);
  document.getElementById('oc').textContent='Processing…';
  if(typeof Tesseract==='undefined'){
    try{await ldScript('https://unpkg.com/tesseract.js@5.0.4/dist/tesseract.min.js');}
    catch{document.getElementById('oc').textContent='OCR requires internet on first use.';prog(100);return;}
  }
  try{
    const dataUrl=document.getElementById('cv').toDataURL('image/png');
    const res=await Tesseract.recognize(dataUrl,'eng',{logger:m=>{if(m.status==='recognizing text')prog(10+Math.round(m.progress*80));}});
    document.getElementById('oc').textContent=res.data.text.trim()||'(No text detected)';
    prog(100);msg('OCR complete');
  }catch(e){document.getElementById('oc').textContent='Failed: '+e.message;prog(100);}
}

// ── Compress ───────────────────────────────────────────────────
async function doCompress(){
  if(!pdfDoc)return;msg('Compressing…');prog(40);
  const bytes=await pdfDoc.save({useObjectStreams:true,addDefaultPage:false,objectsPerTick:50});
  await reload(bytes);dirty=true;prog(100);msg('Compressed');
}

// ── Page ops ───────────────────────────────────────────────────
async function delPage(){delPageAt(curPage);}
async function delPageAt(idx){
  if(!pdfDoc||pgCount<=1)return;
  pdfDoc.removePage(idx);delete anns[idx];
  const bytes=await pdfDoc.save();await reload(bytes);dirty=true;msg('Page deleted');
}
async function movePg(dir){
  if(!pdfDoc)return;const ni=curPage+dir;if(ni<0||ni>=pgCount)return;
  const pages=pdfDoc.getPages();const pg=pages[curPage];
  pdfDoc.removePage(curPage);pdfDoc.insertPage(ni,pg);
  const bytes=await pdfDoc.save();curPage=ni;await reload(bytes);dirty=true;
}

// ── Save ───────────────────────────────────────────────────────
async function doSave(){doSaveAs(false);}
async function doSaveAs(forceAs=true){
  if(!pdfDoc||!window.api)return;
  msg('Saving…');prog(20);
  await bake();prog(60);
  const bytes=await pdfDoc.save({useObjectStreams:true});
  const r=await window.api.saveDialog({title:'Save PDF',defaultPath:fileName,filters:[{name:'PDF',extensions:['pdf']}]});
  if(r.canceled||!r.filePath){prog(100);return;}
  await window.api.writeFile(r.filePath,bytes);
  fileName=r.filePath.split(/[\\/]/).pop();
  document.getElementById('fi').textContent=fileName;
  if(window.api)window.api.setTitle('VyuPDF — '+fileName);
  dirty=false;prog(100);msg('Saved: '+fileName);
}

async function bake(){
  if(!pdfDoc)return;
  const font=await pdfDoc.embedFont(StandardFonts.Helvetica);
  for(const [pidx,panns] of Object.entries(anns)){
    const pdfPg=pdfDoc.getPages()[parseInt(pidx)];if(!pdfPg)continue;
    const c=document.getElementById('cv');
    const sx=pdfPg.getWidth()/c.width,sy=pdfPg.getHeight()/c.height;
    for(const ann of panns){
      const el=ann.el;
      const x=parseFloat(el.style.left)*sx;
      const yTop=parseFloat(el.style.top)*sy;
      const y=pdfPg.getHeight()-yTop-18;
      if(ann.type==='text'){
        const te=ann.textEl||el.querySelector('.at');
        const txt=te?te.textContent:'';if(!txt.trim())continue;
        const fs=Math.max(6,parseFloat((te||el).style.fontSize||'14')*sx);
        const col=h2r((te||el).style.color||'#000');
        pdfPg.drawText(txt,{x,y,size:fs,font,color:rgb(col.r,col.g,col.b),maxWidth:600});
      }else if(ann.type==='image'&&ann.buf){
        try{
          const ib=new Uint8Array(ann.buf instanceof ArrayBuffer?ann.buf:ann.buf.buffer);
          const imgEl=ann.imgEl||el.querySelector('img');
          const w=parseFloat(imgEl.style.width||'220')*sx;
          const h=imgEl.naturalHeight/imgEl.naturalWidth*w;
          let im;try{im=await pdfDoc.embedPng(ib);}catch{im=await pdfDoc.embedJpg(ib);}
          pdfPg.drawImage(im,{x,y:y-h+18,width:w,height:h});
        }catch{}
      }
    }
  }
  anns={};
}

// ── Drag ───────────────────────────────────────────────────────
function makeDrag(wrap, handle){
  handle.addEventListener('mousedown',e=>{
    if(e.target.classList&&(e.target.classList.contains('rz')||e.target.tagName==='BUTTON'))return;
    if(handle.classList&&handle.classList.contains('at'))return; // let text be edited
    e.preventDefault();
    select(wrap);
    const ox=parseFloat(wrap.style.left)||0,oy=parseFloat(wrap.style.top)||0;
    const sx=e.clientX,sy=e.clientY;
    const mv=e2=>{wrap.style.left=(ox+e2.clientX-sx)+'px';wrap.style.top=(oy+e2.clientY-sy)+'px';};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);dirty=true;};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
  // For text: drag only on the wrap border, not the text itself
  wrap.addEventListener('mousedown',e=>{
    if(e.target===handle)return; // handled above
    if(e.target.tagName==='BUTTON')return;
    e.preventDefault();
    select(wrap);
    const ox=parseFloat(wrap.style.left)||0,oy=parseFloat(wrap.style.top)||0;
    const sx=e.clientX,sy=e.clientY;
    const mv=e2=>{wrap.style.left=(ox+e2.clientX-sx)+'px';wrap.style.top=(oy+e2.clientY-sy)+'px';};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);dirty=true;};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}

function makeResize(imgEl,rz){
  rz.addEventListener('mousedown',e=>{
    e.preventDefault();e.stopPropagation();
    const sx=e.clientX,sw=imgEl.offsetWidth;
    const mv=e2=>{imgEl.style.width=Math.max(40,sw+e2.clientX-sx)+'px';};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);dirty=true;};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}

// ── Zoom ───────────────────────────────────────────────────────
async function doZoom(d){setZoom(zoom+d);}
async function setZoom(z){
  zoom=Math.max(.25,Math.min(4,z));
  document.getElementById('zl').textContent=Math.round(zoom*100)+'%';
  if(pdfJSDoc)await renderPage(curPage);
}

function h2r(h){
  if(!h||h.length<7)return{r:0,g:0,b:0};
  return{r:parseInt(h.slice(1,3),16)/255,g:parseInt(h.slice(3,5),16)/255,b:parseInt(h.slice(5,7),16)/255};
}
